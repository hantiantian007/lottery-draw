<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="100%" height="100%">
  <!-- 暗色调阴影 -->
  <rect x="10" y="15" width="80" height="100" rx="12" fill="rgba(0,0,0,0.1)" />
  
  <!-- 红包背板主体 (灰红色渐变) -->
  <defs>
    <linearGradient id="envelopeBgMuted" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9f5454" />
      <stop offset="100%" stop-color="#733240" />
    </linearGradient>
    
    <!-- 暗金色装饰渐变 -->
    <linearGradient id="goldGradientMuted" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d4b476" />
      <stop offset="100%" stop-color="#8a6730" />
    </linearGradient>
  </defs>
  
  <rect x="10" y="10" width="80" height="100" rx="12" fill="url(#envelopeBgMuted)" stroke="url(#goldGradientMuted)" stroke-width="2" />
  
  <!-- 红包翻盖 (顶部弧形) -->
  <path d="M10 40 Q50 65 90 40 L90 22 Q90 10 78 10 L22 10 Q10 10 10 22 Z" fill="#8f4651" />
  
  <!-- 封口圆扣 -->
  <circle cx="50" cy="50" r="12" fill="url(#goldGradientMuted)" opacity="0.8" />
  
  <!-- 打开状态标识 -->
  <path d="M43 45 L57 55 M43 55 L57 45" stroke="#4a2416" stroke-width="2" stroke-linecap="round" />
</svg>