<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>韩梓墨专属抽奖</title>
    <link rel="stylesheet" href="./assets/styles.css" />
  </head>
  <body class="lottery-theme">
    <main class="page lottery-page">
      <header class="minimal-topbar">
        <h1 id="activityTitle">韩梓墨专属抽奖</h1>
      </header>

      <section class="marquee-container">
        <div class="marquee-grid" id="marqueeGrid">
          <!-- Cards rendered by JS -->
        </div>
      </section>

      <section class="action-container">
        <button id="spinButton" class="btn-primary" type="button">开始抽奖</button>
        <p id="chancesText" class="chances-text">今日剩余 3 次机会</p>
      </section>
    </main>

    <div id="resultModal" class="modal theme-dark-modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-card">
        <h2 class="modal-title" id="modalTitle">抽奖结果</h2>
        <div class="modal-body" id="modalBody"></div>
        <div class="modal-actions">
          <button id="closeModalButton" type="button" class="btn-primary" style="width: 100%; font-size: 18px; padding: 12px;">完成</button>
        </div>
      </div>
    </div>

    <!-- 隐藏重置确认弹窗 -->
    <div class="modal-overlay" id="resetModal">
      <div class="modal-card">
        <h2 style="margin-top:0; color:#fde047;">重置抽奖次数</h2>
        <div style="margin: 20px 0; font-size: 16px;">
          确定要将剩余抽奖次数恢复为 <span id="resetModalTargetCount">0</span> 次吗？
        </div>
        <div style="display: flex; gap: 12px; justify-content: center; margin-top: 24px;">
          <button class="secondary-btn" id="cancelResetBtn" style="padding: 12px 30px; font-size: 16px; border-radius: 999px; background: rgba(255,255,255,0.2); color: #fff; border: none; cursor: pointer; min-height: 44px;">取消</button>
          <button class="btn-primary" id="confirmResetBtn" style="padding: 12px 30px; font-size: 16px; min-height: 44px;">确认重置</button>
        </div>
      </div>
    </div>

    <div id="toast" class="toast" aria-live="polite"></div>
    <script type="module" src="./assets/app.js"></script>
  </body>
</html>
