<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="100%" height="100%">
  <!-- 红包主体阴影 -->
  <rect x="10" y="15" width="80" height="100" rx="12" fill="rgba(0,0,0,0.15)" />
  
  <!-- 红包背板主体 (红色渐变) -->
  <defs>
    <linearGradient id="envelopeBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    
    <!-- 金色装饰渐变 -->
    <linearGradient id="goldGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>
  </defs>
  
  <rect x="10" y="10" width="80" height="100" rx="12" fill="url(#envelopeBg)" stroke="url(#goldGradient)" stroke-width="2" />
  
  <!-- 红包翻盖 (顶部弧形) -->
  <path d="M10 40 Q50 65 90 40 L90 22 Q90 10 78 10 L22 10 Q10 10 10 22 Z" fill="#f43f5e" />
  
  <!-- 金色封口圆扣 -->
  <circle cx="50" cy="50" r="12" fill="url(#goldGradient)" />
  <circle cx="50" cy="50" r="9" fill="#fef08a" opacity="0.6" />
  
  <!-- 简单的祥云/福字抽象线条 -->
  <path d="M46 47 L54 47 M48 50 L52 50 M46 53 L54 53 M50 45 L50 55" stroke="#713f12" stroke-width="1.5" stroke-linecap="round" />
</svg>